<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title description">
  <title id="title">MCP authoring benefits by model</title>
  <desc id="description">Across 576 fixed task runs, MCP with bounded fallback improved strict success and reduced tokens and model calls compared with public documentation browsing for Terra, Luna, and Nano.</desc>
  <style>
    text {
      fill: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .model { font-size: 18px; font-weight: 500; }
    .metric { font-size: 14px; font-weight: 500; }
    .delta { font-size: 14px; font-weight: 500; }
    .label, .value, .note { font-size: 12px; font-weight: 400; }
    .value { text-anchor: end; }
    .note { fill: #59636e; text-anchor: middle; }
    .axis, .divider { stroke: #d0d7de; stroke-width: 1; }
    .docs { fill: #8c959f; }
    .mcp { fill: #1f883d; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .note { fill: #8b949e; }
      .axis, .divider { stroke: #30363d; }
      .docs { fill: #8b949e; }
      .mcp { fill: #3fb950; }
    }
  </style>

  <line class="divider" x1="324" y1="18" x2="324" y2="338"/>
  <line class="divider" x1="644" y1="18" x2="644" y2="338"/>

  <g transform="translate(24 12)">
    <text class="model" x="0" y="24">Terra</text>

    <text class="metric" x="0" y="62">Strict success</text>
    <text class="delta value" x="278" y="62">+66.7 pp</text>
    <text class="label" x="0" y="92">Docs only</text>
    <line class="axis" x1="96" y1="94" x2="206" y2="94"/>
    <rect class="docs" x="96" y="84" width="22.88" height="8"/>
    <text class="value" x="278" y="92">20.8%</text>
    <text class="label" x="0" y="117">MCP + fallback</text>
    <line class="axis" x1="96" y1="119" x2="206" y2="119"/>
    <rect class="mcp" x="96" y="109" width="96.25" height="8"/>
    <text class="value" x="278" y="117">87.5%</text>

    <text class="metric" x="0" y="162">Tokens per task</text>
    <text class="delta value" x="278" y="162">−53%</text>
    <text class="label" x="0" y="192">Docs only</text>
    <line class="axis" x1="96" y1="194" x2="206" y2="194"/>
    <rect class="docs" x="96" y="184" width="58.78" height="8"/>
    <text class="value" x="278" y="192">10,688</text>
    <text class="label" x="0" y="217">MCP + fallback</text>
    <line class="axis" x1="96" y1="219" x2="206" y2="219"/>
    <rect class="mcp" x="96" y="209" width="27.41" height="8"/>
    <text class="value" x="278" y="217">4,984</text>

    <text class="metric" x="0" y="262">Model calls per task</text>
    <text class="delta value" x="278" y="262">−41%</text>
    <text class="label" x="0" y="292">Docs only</text>
    <line class="axis" x1="96" y1="294" x2="206" y2="294"/>
    <rect class="docs" x="96" y="284" width="93.5" height="8"/>
    <text class="value" x="278" y="292">4.25</text>
    <text class="label" x="0" y="317">MCP + fallback</text>
    <line class="axis" x1="96" y1="319" x2="206" y2="319"/>
    <rect class="mcp" x="96" y="309" width="55" height="8"/>
    <text class="value" x="278" y="317">2.50</text>
  </g>

  <g transform="translate(344 12)">
    <text class="model" x="0" y="24">Luna</text>

    <text class="metric" x="0" y="62">Strict success</text>
    <text class="delta value" x="278" y="62">+72.9 pp</text>
    <text class="label" x="0" y="92">Docs only</text>
    <line class="axis" x1="96" y1="94" x2="206" y2="94"/>
    <rect class="docs" x="96" y="84" width="20.68" height="8"/>
    <text class="value" x="278" y="92">18.8%</text>
    <text class="label" x="0" y="117">MCP + fallback</text>
    <line class="axis" x1="96" y1="119" x2="206" y2="119"/>
    <rect class="mcp" x="96" y="109" width="100.87" height="8"/>
    <text class="value" x="278" y="117">91.7%</text>

    <text class="metric" x="0" y="162">Tokens per task</text>
    <text class="delta value" x="278" y="162">−48%</text>
    <text class="label" x="0" y="192">Docs only</text>
    <line class="axis" x1="96" y1="194" x2="206" y2="194"/>
    <rect class="docs" x="96" y="184" width="58.26" height="8"/>
    <text class="value" x="278" y="192">10,592</text>
    <text class="label" x="0" y="217">MCP + fallback</text>
    <line class="axis" x1="96" y1="219" x2="206" y2="219"/>
    <rect class="mcp" x="96" y="209" width="30.46" height="8"/>
    <text class="value" x="278" y="217">5,539</text>

    <text class="metric" x="0" y="262">Model calls per task</text>
    <text class="delta value" x="278" y="262">−44%</text>
    <text class="label" x="0" y="292">Docs only</text>
    <line class="axis" x1="96" y1="294" x2="206" y2="294"/>
    <rect class="docs" x="96" y="284" width="99.44" height="8"/>
    <text class="value" x="278" y="292">4.52</text>
    <text class="label" x="0" y="317">MCP + fallback</text>
    <line class="axis" x1="96" y1="319" x2="206" y2="319"/>
    <rect class="mcp" x="96" y="309" width="55.88" height="8"/>
    <text class="value" x="278" y="317">2.54</text>
  </g>

  <g transform="translate(664 12)">
    <text class="model" x="0" y="24">Nano</text>

    <text class="metric" x="0" y="62">Strict success</text>
    <text class="delta value" x="278" y="62">+58.3 pp</text>
    <text class="label" x="0" y="92">Docs only</text>
    <line class="axis" x1="96" y1="94" x2="206" y2="94"/>
    <rect class="docs" x="96" y="84" width="20.68" height="8"/>
    <text class="value" x="278" y="92">18.8%</text>
    <text class="label" x="0" y="117">MCP + fallback</text>
    <line class="axis" x1="96" y1="119" x2="206" y2="119"/>
    <rect class="mcp" x="96" y="109" width="84.81" height="8"/>
    <text class="value" x="278" y="117">77.1%</text>

    <text class="metric" x="0" y="162">Tokens per task</text>
    <text class="delta value" x="278" y="162">−58%</text>
    <text class="label" x="0" y="192">Docs only</text>
    <line class="axis" x1="96" y1="194" x2="206" y2="194"/>
    <rect class="docs" x="96" y="184" width="100.75" height="8"/>
    <text class="value" x="278" y="192">18,319</text>
    <text class="label" x="0" y="217">MCP + fallback</text>
    <line class="axis" x1="96" y1="219" x2="206" y2="219"/>
    <rect class="mcp" x="96" y="209" width="41.98" height="8"/>
    <text class="value" x="278" y="217">7,632</text>

    <text class="metric" x="0" y="262">Model calls per task</text>
    <text class="delta value" x="278" y="262">−40%</text>
    <text class="label" x="0" y="292">Docs only</text>
    <line class="axis" x1="96" y1="294" x2="206" y2="294"/>
    <rect class="docs" x="96" y="284" width="103.62" height="8"/>
    <text class="value" x="278" y="292">4.71</text>
    <text class="label" x="0" y="317">MCP + fallback</text>
    <line class="axis" x1="96" y1="319" x2="206" y2="319"/>
    <rect class="mcp" x="96" y="309" width="62.26" height="8"/>
    <text class="value" x="278" y="317">2.83</text>
  </g>

  <text class="note" x="480" y="366">Fixed evaluation · 576 task runs · 24 tasks × 2 repetitions · 48 observations per model × condition</text>
</svg>
