<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Private outline primitive review</title></head><body><p id="status">Loading</p><main></main><script type="module">
import {drawOutlinePrimitive} from "./primitive.program.js";
import {fontFamily} from "./fixture.js";
const font=new FontFace(fontFamily,"url('../../fixtures/fonts/metric-fixture.ttf')");await font.load();document.fonts.add(font);await document.fonts.ready;
window.renderOutline=async({fixture,groupURL})=>{let image;if(groupURL){image=new Image();image.src=groupURL;await image.decode();}const canvas=document.createElement("canvas");canvas.width=280;canvas.height=200;canvas.setAttribute("aria-label",`Private outline primitive: ${fixture.style}`);document.querySelector("main").append(canvas);drawOutlinePrimitive(canvas.getContext("2d"),fixture,image);const c=canvas.getContext("2d");c.font=`60px "${fontFamily}"`;return{dataURL:canvas.toDataURL(),advance:c.measureText("AB").width};};
document.getElementById("status").textContent="Ready";
</script></body></html>
