<!doctype html><html lang="en"><meta charset="utf-8"><title>Image asset primitive review</title><body><h1>Image fit, clip and alpha</h1><p id="status">Loading</p>
<script type="module">
import { fixtures, frame, assetURI } from './fixture.js';
import { drawImagePrimitive } from './primitive.program.js';
const image = new Image(); image.src = assetURI; await image.decode();
for (const fixture of fixtures) {
  const canvas = document.createElement('canvas'); canvas.id = fixture.id;
  canvas.width = frame.width; canvas.height = frame.height; canvas.setAttribute('aria-label', fixture.id+' image primitive');
  drawImagePrimitive(canvas.getContext('2d'), fixture, image); document.body.append(canvas);
}
document.querySelector('#status').textContent='Ready';
</script></body></html>
