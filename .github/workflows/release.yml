name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag, for example v0.0.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Verify tag, version, and checked-out commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test "$(node -p "require('./package-lock.json').version")" = "$(node -p "require('./package.json').version")"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Pack the exact release candidate once
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-candidate.js "$RELEASE_TAG"
      - name: Retain the exact reviewed release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ggaction-${{ inputs.tag }}
          path: |
            .artifacts/release/candidate.json
            .artifacts/release/ggaction-*.tgz
            .artifacts/release/ggaction-*-release-notes.md
          if-no-files-found: error
          retention-days: 7

  verify-source:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Download the canonical candidate
        uses: actions/download-artifact@v8
        with:
          name: ggaction-${{ inputs.tag }}
          path: .artifacts/release
      - name: Verify and select the exact candidate for package consumers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-candidate.js --verify .artifacts/release/candidate.json "$RELEASE_TAG"
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import path from "node:path";
            const candidate = JSON.parse(readFileSync(".artifacts/release/candidate.json", "utf8"));
            appendFileSync(process.env.GITHUB_ENV, `GGACTION_PACKAGE_SPEC=${path.resolve(".artifacts/release", candidate.filename)}\n`);
          '
      - name: Install Chromium for browser consumers
        run: npx playwright install --with-deps chromium
      - name: Run unit, acceptance, and contract tests
        run: npm test
      - name: Test browser package consumers
        run: npm run test:browser
      - name: Render PNG regression charts
        run: npm run test:render

  verify-coverage:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Download the canonical candidate
        uses: actions/download-artifact@v8
        with:
          name: ggaction-${{ inputs.tag }}
          path: .artifacts/release
      - name: Verify and select the exact candidate for package consumers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-candidate.js --verify .artifacts/release/candidate.json "$RELEASE_TAG"
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import path from "node:path";
            const candidate = JSON.parse(readFileSync(".artifacts/release/candidate.json", "utf8"));
            appendFileSync(process.env.GITHUB_ENV, `GGACTION_PACKAGE_SPEC=${path.resolve(".artifacts/release", candidate.filename)}\n`);
          '
      - name: Install Chromium for browser consumers
        run: npx playwright install --with-deps chromium
      - name: Enforce coverage thresholds
        run: npm run test:coverage

  verify-package:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Download the canonical candidate
        uses: actions/download-artifact@v8
        with:
          name: ggaction-${{ inputs.tag }}
          path: .artifacts/release
      - name: Verify and select the exact candidate for package consumers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-candidate.js --verify .artifacts/release/candidate.json "$RELEASE_TAG"
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import path from "node:path";
            const candidate = JSON.parse(readFileSync(".artifacts/release/candidate.json", "utf8"));
            appendFileSync(process.env.GITHUB_ENV, `GGACTION_PACKAGE_SPEC=${path.resolve(".artifacts/release", candidate.filename)}\n`);
          '
      - name: Install Chromium for browser consumers
        run: npx playwright install --with-deps chromium
      - name: Test the installed canonical package
        run: npm run test:package

  verify-documentation:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Download the canonical candidate
        uses: actions/download-artifact@v8
        with:
          name: ggaction-${{ inputs.tag }}
          path: .artifacts/release
      - name: Verify and select the exact candidate for package consumers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-candidate.js --verify .artifacts/release/candidate.json "$RELEASE_TAG"
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import path from "node:path";
            const candidate = JSON.parse(readFileSync(".artifacts/release/candidate.json", "utf8"));
            appendFileSync(process.env.GITHUB_ENV, `GGACTION_PACKAGE_SPEC=${path.resolve(".artifacts/release", candidate.filename)}\n`);
          '
      - name: Install Chromium for browser consumers
        run: npx playwright install --with-deps chromium
      - name: Set up the documentation runtime
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.6"
          bundler-cache: true
      - name: Verify generated contracts and documentation
        run: |
          npm run contracts:catalog:check
          npm run docs:generate
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { buildDocProvenance } from "./scripts/doc-provenance.js";
            assert.equal((await buildDocProvenance()).status, "published-release");
          '
          npm run test:docs
          # Native Canvas PNG bytes vary across supported operating systems.
          # Their sources, manifest, dimensions, and rendered output remain
          # covered by documentation and render tests; all other generated
          # documentation must stay byte-identical to the release tag.
          git diff --exit-code -- \
            docs \
            examples/README.md \
            knowledge/action-cards.json \
            ':(exclude)docs/assets/images/*.png'
      - name: Build documentation with Jekyll
        run: npm run docs:build
      - name: Check built documentation
        run: npm run test:docs:built
      - name: Test documentation in desktop and mobile browsers
        run: npm run test:docs:browser

  realistic-data:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Restore verified dataset corpus
        id: dataset-cache
        uses: actions/cache@v5
        with:
          path: .artifacts/datasets/tidytuesday
          key: ggaction-tidytuesday-${{ runner.os }}-${{ hashFiles('data/corpus/manifest.json') }}
      - name: Fetch and verify dataset corpus
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: npm run datasets:sync

  verify-realistic:
    needs: [candidate, realistic-data]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Download the canonical candidate
        uses: actions/download-artifact@v8
        with:
          name: ggaction-${{ inputs.tag }}
          path: .artifacts/release
      - name: Verify and select the exact candidate for package consumers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-candidate.js --verify .artifacts/release/candidate.json "$RELEASE_TAG"
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import path from "node:path";
            const candidate = JSON.parse(readFileSync(".artifacts/release/candidate.json", "utf8"));
            appendFileSync(process.env.GITHUB_ENV, `GGACTION_PACKAGE_SPEC=${path.resolve(".artifacts/release", candidate.filename)}\n`);
          '
      - name: Restore verified dataset corpus
        id: dataset-cache
        uses: actions/cache@v5
        with:
          path: .artifacts/datasets/tidytuesday
          key: ggaction-tidytuesday-${{ runner.os }}-${{ hashFiles('data/corpus/manifest.json') }}
      - name: Fetch and verify dataset corpus
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: npm run datasets:sync
      - name: Run the assigned realistic files
        run: npm run test:realistic -- --shard=${{ matrix.shard }}/7

  verify:
    if: ${{ always() }}
    needs: [candidate, verify-source, verify-coverage, verify-package, verify-documentation, realistic-data, verify-realistic]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Require every verification job to succeed
        env:
          GGACTION_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/test-sharding.js --check-jobs candidate verify-source verify-coverage verify-package verify-documentation realistic-data verify-realistic

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/ggaction
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the approved tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js without a release cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install a trusted-publishing-capable npm CLI
        run: npm install --global "npm@^11.5.1"
      - name: Download the reviewed release artifact
        uses: actions/download-artifact@v8
        with:
          name: ggaction-${{ inputs.tag }}
          path: .artifacts/release
      - name: Verify downloaded artifact identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-candidate.js --verify .artifacts/release/candidate.json "$RELEASE_TAG"
      - name: Check whether this exact version is already public
        id: registry
        run: |
          set -euo pipefail
          PACKAGE=$(node -p "require('./.artifacts/release/candidate.json').name")
          VERSION=$(node -p "require('./.artifacts/release/candidate.json').version")
          LOCAL_SHA1=$(node -p "require('./.artifacts/release/candidate.json').sha1")
          if REMOTE_SHA1=$(npm view "$PACKAGE@$VERSION" dist.shasum 2>.artifacts/release/npm-view-error.log); then
            test "$REMOTE_SHA1" = "$LOCAL_SHA1"
            echo "already=true" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" .artifacts/release/npm-view-error.log; then
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            cat .artifacts/release/npm-view-error.log >&2
            exit 1
          fi
      - name: Publish to npm through OIDC
        if: steps.registry.outputs.already != 'true'
        run: |
          TARBALL=".artifacts/release/$(node -p "require('./.artifacts/release/candidate.json').filename")"
          npm publish "$TARBALL" --access public --tag latest
      - name: Create or repair the matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./.artifacts/release/candidate.json').version")
          NOTES=".artifacts/release/$(node -p "require('./.artifacts/release/candidate.json').releaseNotes")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "ggaction $VERSION" --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "ggaction $VERSION" --notes-file "$NOTES"
          fi

  pages-build:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the approved tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify the documentation source commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up the documentation runtime
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.6"
          bundler-cache: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build the exact release documentation
        run: npm run docs:build
      - name: Check the built documentation
        run: npm run test:docs:built
      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  context7-refresh:
    needs: publish
    uses: ./.github/workflows/context7-refresh.yml
    secrets:
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the approved release documentation
        id: deployment
        uses: actions/deploy-pages@v5
