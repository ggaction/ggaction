name: Refresh Context7 documentation

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: context7-refresh-${{ github.repository }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh /${{ github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Refresh released documentation
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "${CONTEXT7_API_KEY}" ]; then
            echo "::error::Add CONTEXT7_API_KEY as a repository Actions secret before running this workflow."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://context7.com/api/v1/refresh \
            --header "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"libraryName":"/${{ github.repository }}"}'
