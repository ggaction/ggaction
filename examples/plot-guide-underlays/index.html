<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ggaction Plot Guide Underlays</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f3f4f6; color:#1f2937; font:16px/1.5 system-ui,sans-serif; }
    main { margin:24px; padding:24px; max-width:calc(100vw - 48px); box-sizing:border-box; overflow:auto; background:white; border-radius:12px; }
    h1 { margin:0 0 4px; font-size:20px; } p { margin:0 0 16px; color:#64748b; }
    canvas { display:block; border:1px solid #e2e8f0; }

<body data-chart="plot-guide-underlays">
  <main>
    <h1 id="title">Plot Guide Underlays</h1>

  <script type="module" src="../browser-host/main.js"></script>
