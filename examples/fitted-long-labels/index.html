<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ggaction Fitted Long Axis Labels</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #1f2937;
        background: #f3f4f6;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        margin: 24px;
        padding: 24px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 12px 36px rgb(15 23 42 / 12%);
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      p { margin: 0 0 16px; color: #64748b; }
      canvas { display: block; max-width: 100%; height: auto; border: 1px solid #e2e8f0; }
    </style>
  </head>
  <body data-chart="fitted-long-labels">
    <main>
      <h1 id="title">Fitted long axis labels</h1>
      <p id="status">Building chart…</p>
      <canvas id="chart" aria-label="Market account scores with fitted wrapped labels"></canvas>
    </main>
    <script type="module" src="../browser-host/main.js"></script>
  </body>
</html>
